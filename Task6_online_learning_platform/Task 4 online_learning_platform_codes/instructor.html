<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instructor Dashboard — DataPath Academy Pro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar" id="navbar"></header>

<div class="dash-shell">
  <aside class="dash-sidebar">
    <a href="instructor.html" class="active">📊 Overview</a>
    <a href="#" id="link-new-course">➕ New course</a>
    <a href="#" id="link-logout">🚪 Log out</a>
  </aside>
  <main class="dash-main">
    <div class="eyebrow">Instructor dashboard</div>
    <h2 id="welcome-heading" style="margin-bottom:0;">Welcome back</h2>

    <div class="grid grid-4 mt-24">
      <div class="stat-card"><b id="stat-courses">0</b><span>Courses taught</span></div>
      <div class="stat-card"><b id="stat-students">0</b><span>Total students</span></div>
      <div class="stat-card"><b id="stat-rating">0</b><span>Average rating</span></div>
      <div class="stat-card"><b id="stat-revenue">₵0</b><span>Est. revenue</span></div>
    </div>

    <div class="tabs mt-32">
      <button class="tab-btn active" data-tab="tab-courses">My courses</button>
      <button class="tab-btn" data-tab="tab-students">Students</button>
      <button class="tab-btn" data-tab="tab-new">Create course</button>
    </div>

    <div class="tab-panel active" id="tab-courses">
      <div id="instructor-course-list"></div>
    </div>

    <div class="tab-panel" id="tab-students">
      <div class="card">
        <table>
          <thead><tr><th>Student</th><th>Course</th><th>Progress</th><th>Enrolled</th></tr></thead>
          <tbody id="student-table-body"></tbody>
        </table>
      </div>
    </div>

    <div class="tab-panel" id="tab-new">
      <div class="card" style="max-width:560px;">
        <h4>Propose a new course</h4>
        <p class="small">Submitted courses are added to the catalog as a draft your admin team can review.</p>
        <form id="new-course-form">
          <div class="field">
            <label for="nc-title">Course title</label>
            <input type="text" id="nc-title" required placeholder="e.g. Advanced Terraform for Cloud Teams">
          </div>
          <div class="field">
            <label for="nc-category">Category</label>
            <select id="nc-category">${''}</select>
          </div>
          <div class="field">
            <label for="nc-level">Level</label>
            <select id="nc-level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select>
          </div>
          <div class="field">
            <label for="nc-desc">Description</label>
            <textarea id="nc-desc" rows="3" required placeholder="What will students learn?"></textarea>
          </div>
          <div class="field">
            <label for="nc-price">Price (₵, 0 for free)</label>
            <input type="number" id="nc-price" value="199" min="0">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Submit course</button>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  const user = dpaRequireRole(["instructor"]);
  if (user) {
    dpaRenderNavbar("dash");
    document.getElementById("welcome-heading").textContent = `Welcome back, ${user.name.split(" ")[0]}`;
    document.getElementById("link-logout").addEventListener("click", e => { e.preventDefault(); dpaLogout(); });
    document.getElementById("link-new-course").addEventListener("click", e => {
      e.preventDefault();
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelector('[data-tab="tab-new"]').classList.add("active");
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      document.getElementById("tab-new").classList.add("active");
    });
    document.getElementById("nc-category").innerHTML = DPA_CATEGORIES.map(c => `<option>${c}</option>`).join("");

    const allCourses = dpaGetCourses();
    const myCourses = allCourses.filter(c => c.instructorId === user.instructorId);
    const allUsers = dpaGetUsers().filter(u => u.role === "student");

    function enrollmentCount(courseId) {
      return allUsers.filter(u => u.enrollments && u.enrollments[courseId]).length;
    }

    document.getElementById("stat-courses").textContent = myCourses.length;
    document.getElementById("stat-students").textContent = myCourses.reduce((s, c) => s + enrollmentCount(c.id), 0);
    document.getElementById("stat-rating").textContent = myCourses.length ? (myCourses.reduce((s,c) => s + parseFloat(c.rating), 0) / myCourses.length).toFixed(1) : "—";
    document.getElementById("stat-revenue").textContent = "₵" + myCourses.reduce((s, c) => s + c.price * enrollmentCount(c.id), 0).toLocaleString();

    document.getElementById("instructor-course-list").innerHTML = myCourses.length ? `
      <div class="card">
        <table>
          <thead><tr><th>Course</th><th>Level</th><th>Students</th><th>Rating</th><th>Price</th></tr></thead>
          <tbody>
            ${myCourses.map(c => `
              <tr>
                <td><a href="course.html?id=${c.id}" style="color:var(--cyan);">${c.title}</a></td>
                <td><span class="badge badge-level-${c.level}">${c.level}</span></td>
                <td>${enrollmentCount(c.id)}</td>
                <td>${c.rating} ★</td>
                <td>${dpaFormatPrice(c.price)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    ` : `<div class="empty-state">No courses assigned to your instructor profile yet. Create one in the "Create course" tab.</div>`;

    const rows = [];
    allUsers.forEach(stu => {
      Object.keys(stu.enrollments || {}).forEach(cid => {
        const course = allCourses.find(c => c.id === cid);
        if (course && course.instructorId === user.instructorId) {
          const progress = dpaCourseProgress(stu, cid);
          rows.push(`<tr><td>${stu.name}</td><td>${course.title}</td><td>${progress.pct}%</td><td>${new Date(stu.enrollments[cid].enrolledAt).toISOString().slice(0,10)}</td></tr>`);
        }
      });
    });
    document.getElementById("student-table-body").innerHTML = rows.join("") || `<tr><td colspan="4" class="text-muted">No students enrolled yet.</td></tr>`;

    dpaInitTabs();

    document.getElementById("new-course-form").addEventListener("submit", e => {
      e.preventDefault();
      const title = document.getElementById("nc-title").value.trim();
      const category = document.getElementById("nc-category").value;
      const level = document.getElementById("nc-level").value;
      const desc = document.getElementById("nc-desc").value.trim();
      const price = parseInt(document.getElementById("nc-price").value, 10) || 0;
      const courses = dpaGetCourses();
      const newId = "crs-" + (courses.length + 1).toString().padStart(2, "0") + "-draft";
      courses.push({
        id: newId, title, category, level, instructorId: user.instructorId, description: desc,
        price, originalPrice: price, rating: "0.0", reviewCount: 0, studentCount: 0,
        hours: 4, lessonCount: 12, modules: dpaBuildModules(title, `${title}: Final Capstone Project`)
      });
      localStorage.setItem("dpa_courses", JSON.stringify(courses));
      dpaToast("Course submitted — now live in the catalog.");
      e.target.reset();
      setTimeout(() => window.location.reload(), 900);
    });
  }
</script>
</body>
</html>
