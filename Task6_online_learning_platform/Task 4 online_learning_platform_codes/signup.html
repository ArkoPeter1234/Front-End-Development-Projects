<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — DataPath Academy Pro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar" id="navbar"></header>

<section class="section">
  <div class="container form-card">
    <div class="card">
      <div class="eyebrow">Join DataPath Pro</div>
      <h2>Create your account</h2>
      <form id="signup-form">
        <div class="role-picker">
          <label><input type="radio" name="role" value="student" checked> Student — take courses</label>
          <label><input type="radio" name="role" value="instructor"> Instructor — teach courses</label>
        </div>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" required placeholder="e.g. Ama Serwaa">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="4" placeholder="At least 4 characters">
        </div>
        <div id="signup-error" class="small" style="color:var(--danger);margin-bottom:14px;display:none;"></div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>
      <p class="small text-center mt-24">Already have an account? <a href="login.html" style="color:var(--cyan);">Log in</a></p>
    </div>
  </div>
</section>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  dpaRenderNavbar("");
  if (dpaCurrentUser()) window.location.href = "index.html";

  document.getElementById("signup-form").addEventListener("submit", e => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const role = document.querySelector('input[name="role"]:checked').value;
    const result = dpaSignup({ name, email, password, role });
    const errBox = document.getElementById("signup-error");
    if (!result.ok) {
      errBox.textContent = result.message;
      errBox.style.display = "block";
      return;
    }
    window.location.href = role === "student" ? "dashboard.html" : "instructor.html";
  });
</script>
</body>
</html>
