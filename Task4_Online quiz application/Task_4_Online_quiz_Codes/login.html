<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Login · Sentinel Exams</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="page-main">
  <div class="auth-wrap">
    <form class="auth-card" id="loginForm" novalidate>
      <div class="auth-seal" data-icon="brand"></div>
      <h1 class="auth-title">Candidate Login</h1>
      <p class="auth-sub">Log in to access your proctored exam session.</p>

      <div class="form-msg error" id="formMsg"></div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw-row">
          <input type="password" id="password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pwToggle">SHOW</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Log In</button>

      <p class="auth-switch">New candidate? <a href="signup.html">Create an account</a></p>
    </form>
  </div>
</main>

<script src="js/icons.js"></script>
<script src="js/auth.js"></script>
<script>
  if (getCurrentUser()) window.location.href = "index.html";

  document.getElementById("pwToggle").addEventListener("click", (e) => {
    const input = document.getElementById("password");
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    e.target.textContent = showing ? "SHOW" : "HIDE";
  });

  document.getElementById("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const msg = document.getElementById("formMsg");
    msg.className = "form-msg error";
    msg.textContent = "";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) {
      msg.textContent = "Please fill in both fields.";
      msg.classList.add("show");
      return;
    }
    const result = login({ email, password });
    if (!result.ok) {
      msg.textContent = result.message;
      msg.classList.add("show");
      return;
    }
    window.location.href = "index.html";
  });
</script>
</body>
</html>
